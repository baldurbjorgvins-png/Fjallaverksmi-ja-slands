let S={ans:0,ok:0,known:[],hard:[],wrong:[],best:{},bt:{},last:null};
try{Object.assign(S,JSON.parse(localStorage.getItem('fv')||'{}'))}catch(e){}
const sv=()=>{try{localStorage.setItem('fv',JSON.stringify(S))}catch(e){}};
const V={home:'Forsíða',quiz:'Spurningaleikir',flash:'Spjöld',chars:'Persónur',plot:'Söguþráður',time:'Tímalína',games:'Áskoranir',search:'Leit'};
function nav(){$('nav').innerHTML='<b onclick="go(\'home\')">'+IC('mountain')+' Fjallaverksmiðjan</b>'+Object.keys(V).map(k=>`<button onclick="go('${k}')">${V[k]}</button>`).join('')+'<button onclick="tg()">'+IC('contrast')+'</button>'}
function tg(){const r=document.documentElement;r.dataset.theme=r.dataset.theme=='light'?'dark':'light'}
function go(v,x){clearInterval(G&&G.iv);window.scrollTo(0,0);VW[v](x)}
let G=null;
const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
const VW={
home(){const T=[['quiz','target','Spurningaleikir','Krossaspurningar með erfiðleikastigum'],['flash','layers','Þekkingarspjöld','Snúðu og lærðu eftir flokkum'],['chars','users','Persónur','Alfræði og tengsl'],['plot','book','Söguþráður','Samantekt í köflum'],['time','clock','Tímalína','Atburðir og röðunarleikur'],['games','trophy','Þekkingaráskoranir','Sérfræðingur, satt/ósatt, hraðaspurningar']];
app.innerHTML=`<div class="hero"><h1>Hversu vel þekkir þú Fjallaverksmiðju Íslands?</h1><p class="sub">Kannaðu persónurnar, rifjaðu upp ævintýrið og prófaðu þekkingu þína.</p><div class="row"><button class="pri" onclick="go('quiz')">Hefja spurningaleik</button><button onclick="go('flash')">Skoða þekkingarspjöld</button><button onclick="go('chars')">Kanna söguheiminn</button></div></div>
<div class="card"><b>${Q.length} spurningar</b> · ${S.ans} svaraðar (${S.ok} réttar) · ${S.known.length} spjöld lærð${S.last?`<br><small>Síðasti leikur: ${S.last.t} – ${S.last.p}%</small>`:''}
${S.last?`<div class="row"><button onclick="go('quiz')">Halda áfram</button><button onclick="rs()">Endurstilla framvindu</button></div>`:''}</div>
<div class="grid">${T.map(t=>`<div class="card tile" onclick="go('${t[0]}')"><div class="ico">${IC(t[1])}</div><h3>${t[2]}</h3><small>${t[3]}</small></div>`).join('')}</div>`},
quiz(){let n=10,d=0;window.sq=(a,b)=>{if(a)n=a;if(b!==undefined)d=b;document.querySelectorAll('[data-n]').forEach(e=>e.classList.toggle('sel',e.dataset.n==n));document.querySelectorAll('[data-d]').forEach(e=>e.classList.toggle('sel',e.dataset.d==d))};
window.sg=()=>play({qs:sh(Q.filter(q=>!d||q.d==d)).slice(0,n),title:'Spurningaleikur'+(d?' – '+DIF[d]:''),mode:'q'});
app.innerHTML=`<h2>Spurningaleikir</h2><div class="card"><b>Fjöldi spurninga</b><div class="row">${[10,20,50,100,999].map(x=>`<button data-n="${x}" onclick="sq(${x})">${x==999?'Allar':x}</button>`).join('')}</div><b>Erfiðleikastig</b><div class="row">${DIF.map((x,i)=>`<button data-d="${i}" onclick="sq(0,${i})">${x||'Allt'}</button>`).join('')}</div><small>Auðvelt: grunnstaðreyndir · Miðlungs: atburðir og tengsl · Erfitt: smáatriði · Sérfræðingur: nákvæm þekking.</small><br><br><button class="pri" onclick="sg()">Byrja</button></div>`;sq(10,0)},
flash(){let cat='',deck=[],i=0;const mk=()=>{deck=sh(Q.filter(q=>!cat||q.c==cat));i=0;draw()};
window.fc=c=>{cat=c;mk()};window.fl=()=>$('fl').classList.toggle('on');
window.fk=k=>{const id=deck[i].id,a=k?S.known:S.hard,b=k?S.hard:S.known;if(!a.includes(id))a.push(id);const j=b.indexOf(id);if(j>=0)b.splice(j,1);sv();i++;draw()};
function draw(){const q=deck[i];app.innerHTML=`<h2>Þekkingarspjöld</h2><select onchange="fc(this.value)"><option value="">Allir flokkar</option>${Object.keys(CAT).map(k=>`<option value="${k}"${k==cat?' selected':''}>${CAT[k]}</option>`).join('')}</select><div class="row"><button onclick="fc(cat)">${IC('shuffle')} Stokka</button></div>`+(q?`${bar(i/deck.length*100)}<small>${i+1} / ${deck.length}</small><div class="flip" id="fl" onclick="fl()"><div class="fi"><div class="fc">${q.q}</div><div class="fc b">${q.a}</div></div></div><div class="row"><button class="pri" onclick="fk(1)">${IC('check')} Kann þetta</button><button onclick="fk(0)">${IC('refresh')} Æfa aftur</button></div>`:`<div class="card">Búið! Þú fórst í gegnum öll spjöldin.</div>`)}
window.fc=c=>{cat=c;mk()};mk()},
chars(x){if(x!==undefined){const c=CH[x],qs=Q.filter(q=>q.q.includes(c[0].split(' ')[0])||q.a.includes(c[0].split(' ')[0]));
app.innerHTML=`<button onclick="go('chars')">← Til baka</button><div class="card"><h2>${c[0]}</h2><p>${c[1]}</p><b>Tengsl og atburðir</b><p>${c[2]}</p>${qs.length?`<button class="pri" onclick="play({qs:sh(qs),title:'${c[0]}',mode:'q'})">Spurningaleikur um ${c[0]} (${qs.length})</button>`:''}</div>`;return}
app.innerHTML=`<h2>Persónusafn</h2><div class="grid">${CH.map((c,i)=>`<div class="card tile" onclick="go('chars',${i})"><h3>${c[0]}</h3><small>${c[1].slice(0,90)}…</small></div>`).join('')}</div>
<h3>Tengslakort</h3><div class="card"><svg viewBox="0 0 400 300" width="100%"><g stroke="#8B5CF6" stroke-width="1.5"><line x1="200" y1="150" x2="90" y2="60"/><line x1="200" y1="150" x2="310" y2="60"/><line x1="200" y1="150" x2="200" y2="270"/><line x1="200" y1="150" x2="60" y2="170"/><line x1="310" y1="60" x2="200" y2="270" stroke-dasharray="4"/></g><g fill="#515BFF"><circle cx="200" cy="150" r="30"/><circle cx="90" cy="60" r="24"/><circle cx="310" cy="60" r="28"/><circle cx="200" cy="270" r="22"/><circle cx="60" cy="170" r="22"/></g><g fill="#fff" font-size="12" text-anchor="middle"><text x="200" y="154">Emma</text><text x="90" y="64">Ása</text><text x="310" y="64">Auðólfur</text><text x="200" y="274">Móri</text><text x="60" y="174">Fríða</text></g><g fill="#A1A7C2" font-size="10" text-anchor="middle"><text x="130" y="95">móðir</text><text x="270" y="95">andstæðingur</text><text x="215" y="215">vinur/deilur</text></g></svg><small>Einfölduð mynd; sjá persónusíður fyrir nánari tengsl.</small></div>`},
plot(){let L=0,sp=0;window.pl=(l,s)=>{if(l!==undefined)L=l;if(s)sp=1;d()};function d(){app.innerHTML=`<h2>Söguþráður</h2><div class="row"><button class="${L?'':'sel'}" onclick="pl(0)">Stutt</button><button class="${L?'sel':''}" onclick="pl(1)">Ítarleg</button></div>`+PL.map((p,i)=>{if(i==4&&!sp)return`<div class="card">${IC('alert')} <b>Spoiler!</b> Næsti hluti sýnir endi bókarinnar.<br><br><button onclick="pl(L,1)">Sýna endinn</button></div>`;const t=i==4?p[3]:p[2];return`<div class="card"><h3>${p[0]} <small>bls. ${p[1]}</small></h3><p>${L||i==4?t:t.split('. ')[0]+'.'}</p>${L&&i<4?`<p><small>${p[3]}</small></p>`:''}</div>`}).join('')}d()},
time(){app.innerHTML=`<h2>Tímalína</h2><button class="pri" onclick="ord()">Raðaðu atburðunum</button>`+EV.map((e,i)=>`<div class="card" onclick="this.querySelector('.x').hidden^=1"><b>${i+1}. ${e[0]}</b>${e[3]?` <small>bls. ${e[3]}</small>`:''}<br><small>${e[1]}</small><div class="x" hidden><p>Persónur: ${e[2]}</p></div></div>`).join('')},
games(){const ex=Q.filter(q=>q.d>=3);app.innerHTML=`<h2>Þekkingaráskoranir</h2><div class="grid">
<div class="card tile" onclick="play({qs:sh(ex),title:'Sérfræðingaáskorun',mode:'q'})"><h3>${IC('trophy')} Ert þú sérfræðingur?</h3><small>${ex.length} erfiðar spurningar (hluti af spurningabankanum)</small></div>
<div class="card tile" onclick="play({qs:sh(Q).slice(0,20),title:'Satt eða ósatt',mode:'tf'})"><h3>${IC('check')} Satt eða ósatt</h3><small>20 staðhæfingar</small></div>
<div class="card tile" onclick="play({qs:sh(Q),title:'Hraðaspurningar',mode:'speed'})"><h3>${IC('zap')} Hraðaspurningar</h3><small>Eins margar og þú getur á 60 sekúndum</small></div>
<div class="card tile" onclick="ord()"><h3>${IC('clock')} Raðaðu atburðunum</h3><small>Rétt tímaröð</small></div>
<div class="card tile" onclick="wr()"><h3>${IC('refresh')} Æfa röng svör</h3><small>${S.wrong.length} spurningar</small></div></div>`},
search(){app.innerHTML=`<h2>Leit</h2><input id="si" placeholder="Leitaðu, t.d. Auðólfur" oninput="sr(this.value)"><div id="sr"></div>`;window.sr=v=>{v=v.toLowerCase().trim();if(v.length<2){$('sr').innerHTML='';return}const m=s=>s.toLowerCase().includes(v);let h='';
CH.forEach((c,i)=>{if(m(c.join(' ')))h+=`<div class="card tile" onclick="go('chars',${i})"><span class="tag">Persóna</span> <b>${c[0]}</b></div>`});
PL.forEach(p=>{if(m(p.join(' ')))h+=`<div class="card"><span class="tag">Samantekt</span> <b>${p[0]}</b></div>`});
EV.forEach(e=>{if(m(e.join(' ')))h+=`<div class="card"><span class="tag">Atburður</span> <b>${e[0]}</b><br><small>${e[1]}</small></div>`});
Q.forEach(q=>{if(m(q.q+q.a))h+=`<div class="card"><span class="tag">Staðreynd</span> ${q.q}<br><b>${q.a}</b></div>`});$('sr').innerHTML=h||'<p class="sub">Ekkert fannst.</p>'}}};
// LEIKJAVÉL
function prep(q,m){if(m=='tf'){const t=Math.random()<.5;return{id:q.id,q:`${q.q} – ${t?q.a:q.w[0]}`,o:['Satt','Ósatt'],c:t?0:1,e:expl(q)}}const o=sh([q.a,...q.w]);return{id:q.id,q:q.q,o,c:o.indexOf(q.a),e:expl(q)}}
function play(o){clearInterval(G&&G.iv);G={...o,qs:o.qs.map(q=>prep(q,o.mode)),i:0,sc:0,wr:[],t0:Date.now(),done:0};if(!G.qs.length){app.innerHTML='<div class="card">Engar spurningar.</div>';return}
if(o.mode=='speed'){G.left=60;G.iv=setInterval(()=>{G.left--;const e=$('tm');if(e)e.textContent=G.left+' s';if(G.left<=0)fin()},1000)}q()}
function q(){const x=G.qs[G.i];if(!x)return fin();window.scrollTo(0,0);app.innerHTML=`<h2>${G.title}</h2>${bar(G.mode=='speed'?G.left/.6:G.i/G.qs.length*100)}<small>${G.i+1} / ${G.qs.length} · ${G.sc} stig ${G.mode=='speed'?'· <span id="tm">'+G.left+' s</span>':''}</small><div class="card"><b>${x.q}</b>${x.o.map((t,i)=>`<button class="opt" onclick="an(${i},this)">${t}</button>`).join('')}<div id="ex"></div></div>`}
function an(i,b){const x=G.qs[G.i];if(G.lock)return;G.lock=1;const ok=i==x.c;S.ans++;if(ok){S.ok++;G.sc++;S.wrong=S.wrong.filter(w=>w!=x.id)}else{G.wr.push(x);if(!S.wrong.includes(x.id))S.wrong.push(x.id)}G.done++;sv();
document.querySelectorAll('.opt').forEach((e,j)=>{if(j==x.c)e.classList.add('ok');else if(j==i)e.classList.add('no')});
const nx=()=>{G.lock=0;G.i++;q()};if(G.mode=='speed')setTimeout(nx,600);else{$('ex').innerHTML=`<p>${ok?IC('check')+' Rétt!':IC('x')+' Rangt.'} ${x.e}</p><button class="pri" onclick="G.lock=0;G.i++;q()">${G.i+1<G.qs.length?'Næsta':'Niðurstöður'}</button>`}}
function rank(p){return p>=95?'Fjallaverksmiðjumeistari':p>=85?'Sérfræðingur':p>=70?'Vel að sér':p>=50?'Áhugamaður':'Nýliði'}
function fin(){clearInterval(G.iv);G.lock=0;const n=G.mode=='speed'?G.done:G.qs.length,p=n?Math.round(G.sc/n*100):0,t=Math.round((Date.now()-G.t0)/1000);
if(!S.best[G.title]||p>S.best[G.title])S.best[G.title]=p;S.last={t:G.title,p};sv();const txt=`Ég fékk ${p}% í „${G.title}“ á Fjallaverksmiðja Íslands – Þekkingarvefur og titilinn ${rank(p)}!`;
window.shr=()=>{navigator.share?navigator.share({text:txt}).catch(()=>{}):navigator.clipboard&&navigator.clipboard.writeText(txt).then(()=>alert('Afritað!'))};const g=G;window.again=()=>play({qs:g.qs.map(x=>Q.find(y=>y.id==x.id)),title:g.title,mode:g.mode});
app.innerHTML=`<div class="card" style="text-align:center"><div class="big">${p}%</div><h2>${rank(p)}</h2><p>${G.sc} af ${n} rétt · ${t} sek · besta: ${S.best[G.title]}%</p><div class="row" style="justify-content:center"><button class="pri" onclick="again()">Spila aftur</button>${G.wr.length?`<button onclick="wr()">Æfa röngu</button>`:''}<button onclick="shr()">Deila</button></div></div>${G.wr.length?'<h3>Röng svör</h3>'+G.wr.map(x=>`<div class="card">${x.q}<br><small>${x.e}</small></div>`).join(''):''}`}
function wr(){const l=Q.filter(x=>S.wrong.includes(x.id));if(!l.length){app.innerHTML='<div class="card">Engin röng svör til að æfa.</div>';return}play({qs:sh(l),title:'Röng svör',mode:'q'})}
function ord(){const k=Math.min(6,EV.length),idx=[...EV.keys()].sort(()=>Math.random()-.5).slice(0,k);const ans=[...idx].sort((a,b)=>a-b);let ch=[];
window.pk=i=>{if(!ch.includes(i))ch.push(i);dr()};window.un=()=>{ch=[];dr()};
function dr(){const done=ch.length==k,ok=done&&ch.every((v,i)=>v==ans[i]);app.innerHTML=`<h2>Raðaðu atburðunum</h2><small>Smelltu á atburðina í réttri tímaröð.</small>${idx.map(i=>`<button class="opt ${ch.includes(i)?'sel':''}" onclick="pk(${i})">${ch.includes(i)?ch.indexOf(i)+1+'. ':''}${EV[i][0]}</button>`).join('')}<div class="row"><button onclick="un()">Byrja aftur</button></div>${done?`<div class="card">${ok?IC('check')+' Rétt röð!':IC('x')+' Ekki alveg. Rétt röð: '+ans.map(i=>EV[i][0]).join(' → ')}<br><br><button class="pri" onclick="ord()">Nýr leikur</button></div>`:''}`}dr()}
function rs(){if(confirm('Endurstilla alla framvindu?')){S={ans:0,ok:0,known:[],hard:[],wrong:[],best:{},bt:{},last:null};sv();go('home')}}
nav();go('home');
</script></body></html>
